name: Windows desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to replace
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    # 与 llama_cpp_bonsai 官方 CUDA 构建一致：windows-latest 现已是 VS 2026，缺 CUDA VS toolset。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            desktop/package-lock.json
      - name: Install desktop dependencies
        run: |
          npm ci --prefix agent
          npm ci --prefix desktop
      - name: Verify UI behaviour
        shell: pwsh
        working-directory: desktop
        run: |
          # 必须在编 CUDA 之前跑：这一步不依赖 llama-server，失败不该烧掉一小时编译。
          # 直接起 electron.exe。Start-Process npx 在 Windows 上经常没把调试端口传进去。
          # Chromium 开关要写在应用目录前面，否则不会打开 9222。
          $electron = Join-Path (Get-Location) "node_modules\electron\dist\electron.exe"
          if (!(Test-Path $electron)) { throw "electron.exe missing" }
          $out = Join-Path $env:RUNNER_TEMP "electron-ui.out.log"
          $err = Join-Path $env:RUNNER_TEMP "electron-ui.err.log"
          $app = Start-Process $electron -ArgumentList "--remote-debugging-port=9222","--disable-gpu","--no-sandbox","." -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            npm run check:ui
            if ($LASTEXITCODE -ne 0) { throw "UI 交互测试失败" }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $err) { Write-Host "--- electron stderr ---"; Get-Content $err -Tail 40 }
          }
      - name: Install CUDA toolkit
        uses: ./llama_cpp_bonsai/.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.3"
          cuda_arch: x64
      - name: Install Ninja
        run: choco install ninja -y

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          rem Ninja 不依赖 VS CUDA toolset；sm_75..sm_120 覆盖 RTX 20/30/40/50 与 A100。
          cmake -S llama_cpp_bonsai -B build-win -G "Ninja Multi-Config" -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DLLAMA_CURL=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;120" -DGGML_VULKAN=OFF -DGGML_OPENMP=OFF
          cmake --build build-win --config Release --target llama-server --parallel
          if errorlevel 1 exit /b 1
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          # CUDA 13 精简安装把 DLL 分在 bin / lib / bin\x64，cmd copy 通配常落空。
          # 对齐上游 llama_cpp_bonsai release.yml 的 robocopy 多路径搜集。
          $dst = "build-win\bin\Release"
          if (!(Test-Path "$dst\llama-server.exe")) { throw "llama-server.exe missing after build" }
          foreach ($src in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\lib", "$env:CUDA_PATH\bin\x64")) {
            if (Test-Path $src) {
              robocopy $src $dst "cudart64_*.dll" "cublas64_*.dll" "cublasLt64_*.dll" /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
              # robocopy: 0-7 都算成功（含「无文件可拷」），≥8 才是真错。
              if ($LASTEXITCODE -ge 8) { throw "robocopy failed from $src (code $LASTEXITCODE)" }
            }
          }
          $dlls = Get-ChildItem $dst -Filter "*.dll" | Select-Object -ExpandProperty Name
          foreach ($need in "cudart64_","cublas64_","cublasLt64_") {
            if (-not ($dlls | Where-Object { $_ -like "$need*" })) {
              Write-Host "CUDA_PATH=$env:CUDA_PATH"
              Get-ChildItem "$env:CUDA_PATH" -Recurse -Filter "*cudart*" -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
              throw "missing CUDA runtime DLL prefix: $need* (found: $($dlls -join ', '))"
            }
          }
          Write-Host "bundled: $($dlls -join ', ')"
          # CI runner 没有 NVIDIA 卡：验证缺显卡时能回落到 CPU，而不是缺 DLL 直接崩。
          & "$dst\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server failed before packaging" }
      - name: Assemble runtime and verify contracts
        shell: pwsh
        env:
          LH_SERVER_PATH: ${{ github.workspace }}\build-win\bin\Release\llama-server.exe
        run: |
          npm run prepare-runtime --prefix desktop
          npm run check --prefix desktop
          node agent/local-harness-agent.mjs --self-check
          if ((Get-Content desktop/package.json | ConvertFrom-Json).version -ne '1.0.0') { throw "desktop version changed" }
          if (!(Test-Path desktop/runtime/llama-server.exe)) { throw "missing llama-server.exe" }
          if (!(Test-Path desktop/runtime/agent/local-harness-agent.mjs)) { throw "missing agent" }
          foreach ($dll in 'cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll') {
            if (!(Get-ChildItem "desktop/runtime/$dll" -ErrorAction SilentlyContinue)) { throw "missing CUDA runtime: $dll" }
          }
          & desktop/runtime/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "packaged llama-server failed" }
      - name: Build installer
        run: npm run dist:win --prefix desktop
      - name: Name release installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist/*Setup*.exe | Select-Object -First 1
          Move-Item $installer.FullName desktop/dist/local_harness_ai_1_0.exe
      - name: Install smoke test
        shell: pwsh
        run: |
          $installer = Get-Item desktop/dist/local_harness_ai_1_0.exe
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\local-harness-ai'
          $app = Join-Path $installed 'local-harness-ai.exe'
          $server = Join-Path $installed 'resources\runtime\llama-server.exe'
          if (!(Test-Path $app)) { throw "installed desktop app is missing" }
          if (!(Test-Path $server)) { throw "installed llama-server is missing" }
          $serverCheck = Start-Process $server -ArgumentList '--version' -PassThru -Wait
          if ($serverCheck.ExitCode -ne 0) { throw "installed llama-server failed" }
          $appCheck = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($appCheck.HasExited) { throw "installed desktop app exited during launch" }
          Stop-Process -Id $appCheck.Id
      - uses: actions/upload-artifact@v4
        with:
          name: local_harness_ai_1_0.exe
          path: desktop/dist/local_harness_ai_1_0.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: desktop/dist/local_harness_ai_1_0.exe
          body: "Windows x64 完整桌面应用：本地/云推理、视觉输入、开发 Agent、工作区、路由、日志和设置，功能与 macOS 版逐项对齐（见 desktop/parity）。llama.cpp 启用 CUDA 加速，支持 RTX 20/30/40/50 系；无 NVIDIA 显卡时自动回落到 CPU。不包含 GGUF 模型、API Key 或本机配置。"
